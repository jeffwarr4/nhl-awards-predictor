# .github/workflows/nhl_predict.yml
# ---------------------------------------------------------------
# Weekly Hart Trophy board. Runs Thursdays 14:23 UTC, October–April
# (the regular season), plus manual runs.
#
# What it does:
#   1. Sets up Python + dependencies
#   2. Checks out stinger-assets (headshots + logos for the graphics)
#   3. Runs Models/nhl_predict_current.py:
#        Data/Processed/ → copied to pages/ (the website's Google Sheet feed)
#        predictions/{season}/: top10 + 30-deep board CSVs, movement snapshot,
#          chips, board + bubble PNGs, carousel caption
#        predictions/nhl_candidates.csv (stinger-assets headshot sync)
#   4. Fails loudly if the top-10 board is empty
#   5. Uploads CSVs + PNGs + caption as artifacts
#   6. Commits pages/ and predictions/ back to main with [skip ci]
#
# The model is NOT retrained here — Models/Artifacts/*.pkl are committed.
# Retrain locally (python Models/nhl_train_v2.py) and commit when data changes.
#
# Secrets (repo Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY — chips, Whys and caption; without it those steps are skipped
# ---------------------------------------------------------------

name: NHL Awards Predictor - Scheduled Run
run-name: ${{ (github.event_name == 'schedule' || inputs.scheduled == 'true') && 'Weekly NHL Hart (scheduled)' || 'Weekly NHL Hart (manual)' }}

on:
  schedule:
    # Thursdays 14:23 UTC, October–April (regular season). Kept off :00, when
    # GitHub delays or drops scheduled runs.
    - cron: "23 14 * 10-12,1-4 4"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Started by the scheduler (skips if this slot already ran). Leave false for a manual run."
        required: false
        default: "false"

permissions:
  actions: read
  contents: write

concurrency:
  group: nhl-predict
  cancel-in-progress: true

jobs:
  # Skip a scheduled run when this slot's board is already done. "Scheduled" means GitHub's cron or a
  # dispatch with scheduled=true (the Cloudflare Worker that starts these jobs on time). A late cron after
  # an on-time Worker run would otherwise redo the board and rewrite the AI chips and captions. Runs started
  # by hand from the Actions tab never skip.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == 'true' }}
        run: |
          if [ "$SCHEDULED" != "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          SINCE=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
          DONE=$(gh run list -R "${{ github.repository }}" --workflow "nhl_predict.yml" --status success --created ">=$SINCE" --limit 20 --json databaseId,event,displayTitle --jq '[.[] | select(.databaseId != ${{ github.run_id }})
                       | select(.event == "schedule" or (.displayTitle | endswith("(scheduled)")))] | length')
          echo "Scheduled runs that succeeded since $SINCE: $DONE"
          if [ "$DONE" -gt 0 ]; then
            echo "::notice::This slot's scheduled run already succeeded; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  predict:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Sibling checkout so STINGER_ASSETS_DIR matches the ../stinger-assets/
      # convention used locally. Asset filenames are lowercase — the runner's
      # filesystem is case-sensitive even though Windows isn't.
      - name: Checkout stinger-assets
        uses: actions/checkout@v4
        with:
          repository: jeffwarr4/stinger-assets
          path: stinger-assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run current-season predictions (v2) + weekly board
        run: python Models/nhl_predict_current.py
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets

      # nhl_predict_current exits non-zero before writing on an empty or short board;
      # this double-checks the file it wrote so a silent regression can't publish a header-only CSV.
      - name: Fail if the top-10 board is empty
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          CSV="predictions/${YEAR}/top10_hart_latest.csv"
          ROWS=$(( $(wc -l < "$CSV") - 1 ))
          echo "$CSV has $ROWS rows"
          if [ "$ROWS" -lt 1 ]; then
            echo "::error::Top-10 Hart board is empty"
            exit 1
          fi

      # Legacy feed for the website's Google Sheet (IMPORTDATA of pages/*.csv).
      - name: Copy flattened outputs to pages/
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          mkdir -p pages
          cp "Data/Processed/nhl_hart_top5_flat_${YEAR}.csv"      pages/top5.csv
          cp "Data/Processed/nhl_hart_6to10_flat_${YEAR}.csv"     pages/top6to10.csv
          cp "Data/Processed/nhl_hart_predictions_v2_${YEAR}.csv" pages/nhl_hart_predictions_v2_latest.csv

      - name: Upload prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nhl-hart-${{ github.run_number }}
          path: |
            predictions/**/*.csv
            predictions/**/*.png
            predictions/**/*.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Commit updated predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          git add pages/*.csv predictions/
          # Hidden movement baseline (30 rows); -f in case a global ignore covers dotfiles
          if [ -f "predictions/${YEAR}/.prev_board_hart.csv" ]; then
            git add -f "predictions/${YEAR}/.prev_board_hart.csv"
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated NHL predictions update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
