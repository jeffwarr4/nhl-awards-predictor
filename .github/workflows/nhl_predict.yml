# .github/workflows/nhl_predict.yml
# ---------------------------------------------------------------
# Weekly Hart Trophy board. Runs Thursdays 15:17 UTC (Cloudflare Worker), October–April
# (the regular season), plus manual runs.
#
# What it does:
#   1. Sets up Python + dependencies
#   2. Checks out stinger-assets (headshots + logos for the graphics)
#   3. Runs Models/nhl_predict_current.py:
#        Data/Processed/ → copied to pages/ (the website's Google Sheet feed)
#        predictions/{season}/: top10 + 30-deep board CSVs, movement snapshot,
#          chips, board + bubble PNGs, carousel caption
#        predictions/nhl_candidates.csv (stinger-assets headshot sync)
#   4. Fails loudly if the top-10 board is empty
#   5. Renders the weekly reel (MP4 + narration script) and uploads the MP4 to the
#      "reel-latest" release; both steps are continue-on-error
#   6. Uploads CSVs + PNGs + caption + reel as artifacts
#   7. Commits pages/ and predictions/ back to main with [skip ci] (reel script + meta, not the MP4)
#
# The model is NOT retrained here — Models/Artifacts/*.pkl are committed.
# Retrain locally (python Models/nhl_train_v2.py) and commit when data changes.
#
# Secrets (repo Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY — chips, Whys, caption and reel script; without it those steps are skipped
# ---------------------------------------------------------------

name: NHL Awards Predictor - Scheduled Run
run-name: ${{ (github.event_name == 'schedule' || inputs.scheduled == 'true') && 'Weekly NHL Hart (scheduled)' || 'Weekly NHL Hart (manual)' }}

on:
  schedule:
    # Started on time by the stinger-scheduler Cloudflare Worker (stinger-website/scheduler) at 15:17 UTC;
    # this cron is the late backup, and the guard job makes it a no-op once the Worker's run succeeded.
    # Thursdays 17:17 UTC, October–April (regular season). Kept off :00, when
    # GitHub delays or drops scheduled runs.
    - cron: "17 17 * 10-12,1-4 4"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Started by the scheduler (skips if this slot already ran). Leave false for a manual run."
        required: false
        default: "false"

permissions:
  actions: read
  contents: write

concurrency:
  group: nhl-predict
  cancel-in-progress: true

jobs:
  # Skip a scheduled run when this slot's board is already done. "Scheduled" means GitHub's cron or a
  # dispatch with scheduled=true (the Cloudflare Worker that starts these jobs on time). A late cron after
  # an on-time Worker run would otherwise redo the board and rewrite the AI chips and captions. Runs started
  # by hand from the Actions tab never skip.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == 'true' }}
        run: |
          if [ "$SCHEDULED" != "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          SINCE=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
          DONE=$(gh run list -R "${{ github.repository }}" --workflow "nhl_predict.yml" --status success --created ">=$SINCE" --limit 20 --json databaseId,event,displayTitle --jq '[.[] | select(.databaseId != ${{ github.run_id }})
                       | select(.event == "schedule" or (.displayTitle | endswith("(scheduled)")))] | length')
          echo "Scheduled runs that succeeded since $SINCE: $DONE"
          if [ "$DONE" -gt 0 ]; then
            echo "::notice::This slot's scheduled run already succeeded; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  predict:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Sibling checkout so STINGER_ASSETS_DIR matches the ../stinger-assets/
      # convention used locally. Asset filenames are lowercase — the runner's
      # filesystem is case-sensitive even though Windows isn't.
      - name: Checkout stinger-assets
        uses: actions/checkout@v7
        with:
          repository: jeffwarr4/stinger-assets
          path: stinger-assets

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run current-season predictions (v2) + weekly board
        run: python Models/nhl_predict_current.py
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets

      # nhl_predict_current exits non-zero before writing on an empty or short board;
      # this double-checks the file it wrote so a silent regression can't publish a header-only CSV.
      - name: Fail if the top-10 board is empty
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          CSV="predictions/${YEAR}/top10_hart_latest.csv"
          ROWS=$(( $(wc -l < "$CSV") - 1 ))
          echo "$CSV has $ROWS rows"
          if [ "$ROWS" -lt 1 ]; then
            echo "::error::Top-10 Hart board is empty"
            exit 1
          fi

      # A player new to the slides (ranks 1-15) has no headshot until stinger-assets' daily sync, which only
      # sees him after this run commits. Fetch any missing ones now (this sport's ESPN rosters only, ~25 s;
      # nothing is committed to stinger-assets, its daily sync does that). If one still can't be found, fail
      # here, before the commit, so a slide with a blank circle never reaches the site or the social draft.
      - name: Fetch missing headshots
        id: headshots
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          python stinger-assets/sync_espn_headshots.py fetch --sport nhl --board "predictions/${YEAR}/board_hart_latest.csv" --strict

      - name: Re-render the slides with the new headshots
        if: steps.headshots.outputs.downloaded != '0'
        run: python -m publish.render_graphics
        env:
          PYTHONIOENCODING: utf-8
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets

      # Weekly reel (one story, silent MP4 + narration script Jeff records; posted the day after the board).
      # Extra: neither step can fail the run, so a reel problem never blocks the board commit or the site.
      - name: Render the reel
        id: reel
        continue-on-error: true
        run: python -m publish.render_reel
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets

      # The MP4 isn't committed. It goes to one reused release, "reel-latest", named for its week
      # (reel_meta.json: release_asset); stinger-website's social-drafts job downloads it from there and
      # emails it. Older weeks' videos are removed from the release.
      - name: Upload the reel to the reel-latest release
        if: steps.reel.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          DIR="predictions/${YEAR}/reel"
          ASSET=$(python -c "import json; print(json.load(open('${DIR}/reel_meta.json'))['release_asset'])")
          cp "${DIR}/reel_latest.mp4" "${RUNNER_TEMP}/${ASSET}"
          gh release view reel-latest >/dev/null 2>&1 || gh release create reel-latest --latest=false \
            --title "Weekly reel (latest)" --notes "This week's Hart reel video. Replaced every week by the weekly workflow."
          gh release upload reel-latest "${RUNNER_TEMP}/${ASSET}" --clobber
          for old in $(gh release view reel-latest --json assets --jq ".assets[].name | select(. != \"${ASSET}\")"); do
            gh release delete-asset reel-latest "$old" --yes
          done
          echo "Reel uploaded: ${ASSET}"

      # Legacy feed for the website's Google Sheet (IMPORTDATA of pages/*.csv).
      - name: Copy flattened outputs to pages/
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          mkdir -p pages
          cp "Data/Processed/nhl_hart_top5_flat_${YEAR}.csv"      pages/top5.csv
          cp "Data/Processed/nhl_hart_6to10_flat_${YEAR}.csv"     pages/top6to10.csv
          cp "Data/Processed/nhl_hart_predictions_v2_${YEAR}.csv" pages/nhl_hart_predictions_v2_latest.csv

      - name: Upload prediction artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nhl-hart-${{ github.run_number }}
          path: |
            predictions/**/*.csv
            predictions/**/*.png
            predictions/**/*.txt
            predictions/**/reel/*.mp4
            predictions/**/reel/*.json
          retention-days: 90
          if-no-files-found: warn

      # One copy of each board per week, kept for good (the timestamped run files are pruned).
      - name: Keep this week's board
        run: python scripts/snapshot_board.py

      - name: Commit updated predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          git add pages/*.csv predictions/
          # Hidden movement baseline (30 rows); -f in case a global ignore covers dotfiles
          if [ -f "predictions/${YEAR}/.prev_board_hart.csv" ]; then
            git add -f "predictions/${YEAR}/.prev_board_hart.csv"
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated NHL predictions update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
